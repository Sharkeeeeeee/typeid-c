name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v5
      - name: Test (C99, warnings as errors)
        run: |
          ${{ matrix.cc }} -std=c99 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -Wpedantic -Werror \
            -o test_typeid tests/test_typeid.c && ./test_typeid
      - name: Test (C11)
        run: |
          ${{ matrix.cc }} -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -o test_typeid tests/test_typeid.c && ./test_typeid
      - name: Test (C++)
        run: |
          ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }} -x c++ -std=c++11 -O2 -Wall -Wextra -Werror \
            -o test_typeid_cpp tests/test_typeid.c && ./test_typeid_cpp
      - name: Test C++17 interface (typeid.hpp)
        run: |
          ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread \
            -o test_typeid_hpp tests/test_typeid.cpp && ./test_typeid_hpp
      - name: Sanitizers
        if: matrix.os == 'ubuntu-latest' && matrix.cc == 'gcc'
        run: |
          gcc -std=c99 -D_DEFAULT_SOURCE -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all \
            -o test_typeid_san tests/test_typeid.c && ./test_typeid_san
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -pthread \
            -o test_typeid_cpp_san tests/test_typeid.cpp && ./test_typeid_cpp_san
          g++ -std=c++17 -g -O1 -fsanitize=thread -pthread \
            -o test_typeid_cpp_tsan tests/test_typeid.cpp && ./test_typeid_cpp_tsan
      - name: SQLite extension
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          make test-sqlite CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra -Werror"
      - name: CLI
        run: |
          make typeid CC=${{ matrix.cc }}
          ./typeid new user
          test "$(./typeid encode prefix 01890a5d-ac96-774b-bcce-b302099a8057)" = prefix_01h455vb4pex5vsknk084sn02q

  fuzz:
    name: fuzz (libFuzzer, 60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build fuzzer
        run: clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all fuzz/fuzz_parse.c -o fuzz_parse
      - name: Run fuzzer
        run: ./fuzz_parse -max_total_time=60 -max_len=128 fuzz/corpus

  cmake-install:
    name: cmake install + find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PWD/stage"
          cmake --build build
          cmake --install build
      - name: Consume with find_package and pkg-config
        run: |
          mkdir consumer
          printf '#define TYPEID_IMPLEMENTATION\n#include <typeid.h>\nint main(void){typeid_t t;return typeid_new(&t,"app");}\n' > consumer/main.c
          printf 'cmake_minimum_required(VERSION 3.14)\nproject(c C)\nfind_package(typeid 0.1 REQUIRED)\nadd_executable(app main.c)\ntarget_link_libraries(app PRIVATE typeid::typeid)\n' > consumer/CMakeLists.txt
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build consumer/build && ./consumer/build/app
          PKG_CONFIG_PATH="$PWD/stage/share/pkgconfig" cc $(PKG_CONFIG_PATH="$PWD/stage/share/pkgconfig" pkg-config --cflags typeid) consumer/main.c -o app_pc && ./app_pc

  conan:
    name: conan create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create and test package
        run: |
          pip install conan
          conan profile detect
          conan create . --build=missing

  vcpkg:
    name: vcpkg overlay port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install port
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install typeid-c --overlay-ports=ports
      - name: Build consumer
        run: |
          cmake -S test_package -B consumer \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build consumer
          ./consumer/test_package

  windows:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
